# Konfigurasi deploy ke Render (https://render.com) — paket gratis.
# Render membaca file ini lewat menu "New > Blueprint".
# Nilai rahasia (sync: false) diisi manual di dashboard Render, TIDAK disimpan di sini.

services:
  - type: web
    name: whistleforyeyo
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/board
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: TRUST_PROXY
        value: "1"
      # Salin dari server/.env di laptop
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      # Dari dashboard Turso (https://turso.tech)
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Alamat situs, mis. https://whistleforyeyo.onrender.com
      - key: PUBLIC_URL
        sync: false
      - key: VITE_PUBLIC_URL
        sync: false
